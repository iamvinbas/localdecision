[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localdecision"
version = "0.1.0"
description = "Typed, calibrated decisions from open-weight LLMs in a single forward pass, fully local."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vincenzo Basile" }]
requires-python = ">=3.11"
keywords = ["llm", "decision", "classification", "calibration", "mlx", "local-ai", "system-one"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26", "pydantic>=2.7,<3"]

[project.optional-dependencies]
# Pick one inference backend.
mlx = ["mlx>=0.29", "mlx-lm>=0.28"]                       # Apple Silicon (Metal)
torch = ["torch>=2.4", "transformers>=4.56", "accelerate>=1.0"]  # CUDA / MPS / CPU
server = ["fastapi>=0.115", "uvicorn>=0.30"]
datasets = ["datasets>=3.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "fastapi>=0.115"]

[project.scripts]
localdecision = "localdecision.cli:main"

[project.urls]
Repository = "https://github.com/iamvinbas/localdecision"

[tool.hatch.build.targets.wheel]
packages = ["src/localdecision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs real model weights (set LOCALDECISION_TEST_MODEL)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
